<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TECHM8 China Purchasing</title>
  <script src="./supabase-config.js"></script>
  <script src="./staff-auth.js?v=20260904.1"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./purchasing-admin.css?v=20261003.2">
</head>
<body>
  <div class="pa-app" id="app" data-auth-protected>
    <header class="pa-head">
      <h1>采购跟单</h1>
      <label class="pa-search" title="品名、国内单号、国际单号、入仓号、供货商都能搜">
        <i class="bi bi-search"></i>
        <input id="globalSearch" type="search" placeholder="输入品名或单号，马上看到货到哪了" autocomplete="off">
      </label>
      <div class="pa-head-actions">
        <button class="pa-btn primary" type="button" data-action="chat-import"><i class="bi bi-chat-dots"></i> 粘贴聊天记录</button>
        <button class="pa-btn" type="button" data-action="new-parcel"><i class="bi bi-plus-lg"></i> 登记包裹</button>
        <button class="pa-btn ghost" type="button" data-action="refresh" title="刷新"><i class="bi bi-arrow-clockwise"></i></button>
      </div>
    </header>

    <nav class="pa-tabs" id="tabs" role="tablist" aria-label="采购跟单">
      <button class="pa-tab active" type="button" data-tab="shipments"><i class="bi bi-water"></i> 国际单 <span class="count" data-count="shipments" hidden></span></button>
      <button class="pa-tab" type="button" data-tab="items"><i class="bi bi-geo-alt"></i> 货品在哪</button>
      <button class="pa-tab" type="button" data-tab="receiving"><i class="bi bi-clipboard-check"></i> 签收入库 <span class="count" data-count="receiving" hidden></span></button>
      <span class="pa-tabs-spacer"></span>
      <button class="pa-tab minor" type="button" data-tab="orders"><i class="bi bi-receipt"></i> 采购单</button>
      <button class="pa-tab minor" type="button" data-tab="settings"><i class="bi bi-gear"></i> 设置</button>
    </nav>

    <div class="pa-status" id="statusBar" hidden></div>
    <main id="view"><div class="pa-loading"><i class="bi bi-arrow-repeat"></i> 加载中…</div></main>
  </div>

  <div class="pa-drawer" id="drawer" hidden>
    <div class="pa-drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
      <div class="pa-drawer-head">
        <div><h2 id="drawerTitle"></h2><p id="drawerSubtitle"></p></div>
        <button class="pa-close" type="button" data-action="close-drawer" aria-label="关闭"><i class="bi bi-x-lg"></i></button>
      </div>
      <div class="pa-drawer-body" id="drawerBody"></div>
      <div class="pa-drawer-foot" id="drawerFoot"></div>
    </div>
  </div>

  <div class="pa-modal" id="modal" hidden></div>
  <div class="pa-toast" id="toast" hidden></div>

  <script src="./purchasing-admin.js?v=20261003.3"></script>
</body>
</html>
