<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TECHM8 Stocktake Access</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;650;750;850;950&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="./supabase-config.js"></script>
  <script src="./staff-auth.js?v=20260821"></script>
  <style>
    :root {
      --green: #07896f;
      --green-dark: #045b49;
      --ink: #14242d;
      --muted: #64747c;
      --line: #d9e3e7;
      --bg: #eef3f5;
      --red: #c83e35;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--bg);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }
    button, a { font: inherit; }
    .shell { width: min(1120px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 48px; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
    }
    h1, h2, p { margin: 0; }
    h1 { font-size: 24px; font-weight: 950; }
    .subtitle { margin-top: 6px; color: var(--muted); font-size: 13px; font-weight: 650; line-height: 1.5; }
    .actions { display: flex; gap: 9px; }
    .button {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: #3f5058;
      background: #fff;
      text-decoration: none;
      font-weight: 850;
      cursor: pointer;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 14px;
    }
    .summary-item {
      min-height: 92px;
      display: grid;
      align-content: center;
      gap: 5px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }
    .summary-item span { color: var(--muted); font-size: 12px; font-weight: 750; }
    .summary-item strong { font-size: 24px; font-weight: 950; }
    .panel {
      margin-top: 14px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
    }
    .panel-head { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .panel-head h2 { font-size: 18px; font-weight: 950; }
    .staff-list { display: grid; gap: 8px; }
    .staff-row {
      min-height: 76px;
      display: grid;
      grid-template-columns: 46px minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 13px;
      padding: 12px 14px;
      border: 1px solid #e4ebee;
      border-radius: 8px;
      background: #fbfcfc;
    }
    .staff-avatar {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      color: var(--green-dark);
      background: #dff3ed;
      font-size: 19px;
    }
    .staff-copy { min-width: 0; display: grid; gap: 5px; }
    .staff-name { font-size: 15px; font-weight: 950; }
    .staff-meta { color: var(--muted); font-size: 12px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .status {
      min-width: 72px;
      padding: 6px 9px;
      border-radius: 999px;
      color: #6b777d;
      background: #e9eef0;
      font-size: 11px;
      font-weight: 900;
      text-align: center;
    }
    .status.enabled { color: var(--green-dark); background: #dff5ee; }
    .toggle { position: relative; width: 50px; height: 28px; display: inline-block; }
    .toggle input { position: absolute; opacity: 0; pointer-events: none; }
    .toggle-track {
      position: absolute;
      inset: 0;
      border: 1px solid #cbd6da;
      border-radius: 999px;
      background: #dfe6e8;
      cursor: pointer;
      transition: .16s ease;
    }
    .toggle-track::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 5px rgba(12, 27, 34, .2);
      transition: .16s ease;
    }
    .toggle input:checked + .toggle-track { border-color: var(--green); background: var(--green); }
    .toggle input:checked + .toggle-track::after { transform: translateX(22px); }
    .toggle input:focus-visible + .toggle-track { outline: 3px solid rgba(7, 137, 111, .2); }
    .toggle input:disabled + .toggle-track { cursor: wait; opacity: .55; }
    .empty { padding: 30px; color: var(--muted); text-align: center; font-weight: 750; }
    .error { min-height: 20px; margin-top: 12px; color: var(--red); font-size: 13px; font-weight: 750; }
    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      max-width: min(380px, calc(100vw - 40px));
      padding: 13px 15px;
      border-radius: 8px;
      color: #fff;
      background: #14242d;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: .18s ease;
      font-size: 13px;
      font-weight: 800;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    @media (max-width: 680px) {
      .shell { width: min(100% - 20px, 1120px); padding-top: 10px; }
      .topbar { align-items: stretch; flex-direction: column; }
      .actions { justify-content: flex-start; }
      .summary { grid-template-columns: 1fr; }
      .staff-row { grid-template-columns: 42px minmax(0, 1fr) auto; }
      .status { display: none; }
    }
  </style>
</head>
<body>
  <main class="shell" data-auth-protected>
    <header class="topbar">
      <div>
        <h1>Stocktake Access</h1>
        <p class="subtitle">Temporarily allow a staff member to edit POS categories and quantities. Disable access when stocktake is finished.</p>
      </div>
      <div class="actions">
        <button id="refreshBtn" class="button" type="button"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
        <a class="button" href="./admin.html"><i class="bi bi-arrow-left"></i> Back</a>
      </div>
    </header>

    <section class="summary" aria-label="Stocktake access summary">
      <div class="summary-item"><span>Active staff</span><strong id="staffCount">0</strong></div>
      <div class="summary-item"><span>Access enabled</span><strong id="enabledCount">0</strong></div>
      <div class="summary-item"><span>Access disabled</span><strong id="disabledCount">0</strong></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div>
          <h2>Staff Permissions</h2>
          <p class="subtitle">The POS checks this permission again every time a change is saved.</p>
        </div>
      </div>
      <div id="staffList" class="staff-list"><div class="empty">Loading staff...</div></div>
      <div id="pageError" class="error" role="alert"></div>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    const els = {
      refreshBtn: document.getElementById('refreshBtn'),
      staffList: document.getElementById('staffList'),
      staffCount: document.getElementById('staffCount'),
      enabledCount: document.getElementById('enabledCount'),
      disabledCount: document.getElementById('disabledCount'),
      pageError: document.getElementById('pageError'),
      toast: document.getElementById('toast')
    };
    let staffRows = [];

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      }[char]));
    }

    function showToast(message) {
      els.toast.textContent = message;
      els.toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => els.toast.classList.remove('show'), 2400);
    }

    function renderStaff() {
      const enabled = staffRows.filter(row => row.enabled).length;
      els.staffCount.textContent = String(staffRows.length);
      els.enabledCount.textContent = String(enabled);
      els.disabledCount.textContent = String(staffRows.length - enabled);
      if (!staffRows.length) {
        els.staffList.innerHTML = '<div class="empty">No active staff found.</div>';
        return;
      }
      els.staffList.innerHTML = staffRows.map(row => {
        const meta = [row.job_role ? String(row.job_role).replace(/_/g, ' ') : '', row.default_store_name || 'No default store'].filter(Boolean).join(' · ');
        return `
          <div class="staff-row" data-staff-row="${Number(row.staff_id)}">
            <div class="staff-avatar"><i class="bi bi-person-badge"></i></div>
            <div class="staff-copy">
              <div class="staff-name">${escapeHtml(row.display_name)}</div>
              <div class="staff-meta">${escapeHtml(meta)}</div>
            </div>
            <span class="status ${row.enabled ? 'enabled' : ''}">${row.enabled ? 'Enabled' : 'Disabled'}</span>
            <label class="toggle" title="${row.enabled ? 'Disable' : 'Enable'} stocktake access for ${escapeHtml(row.display_name)}">
              <input type="checkbox" data-stocktake-toggle="${Number(row.staff_id)}" ${row.enabled ? 'checked' : ''} aria-label="Stocktake access for ${escapeHtml(row.display_name)}">
              <span class="toggle-track"></span>
            </label>
          </div>
        `;
      }).join('');
    }

    async function loadPermissions() {
      els.pageError.textContent = '';
      els.refreshBtn.disabled = true;
      try {
        const result = await window.Techm8StaffAuth.callRpc('get_pos_stocktake_permissions', {
          session_token: window.Techm8StaffAuth.getToken()
        });
        staffRows = Array.isArray(result.staff) ? result.staff : [];
        renderStaff();
      } catch (error) {
        console.error(error);
        els.pageError.textContent = error.message || 'Stocktake permissions could not be loaded.';
      } finally {
        els.refreshBtn.disabled = false;
      }
    }

    async function changePermission(input) {
      const staffId = Number(input.dataset.stocktakeToggle);
      const row = staffRows.find(item => Number(item.staff_id) === staffId);
      if (!row) return;
      const nextEnabled = input.checked;
      input.disabled = true;
      els.pageError.textContent = '';
      try {
        const result = await window.Techm8StaffAuth.callRpc('set_pos_stocktake_permission', {
          session_token: window.Techm8StaffAuth.getToken(),
          target_staff_id: staffId,
          target_enabled: nextEnabled
        });
        row.enabled = Boolean(result.enabled);
        row.updated_at = result.updated_at || new Date().toISOString();
        renderStaff();
        showToast(`${row.display_name}: stocktake access ${row.enabled ? 'enabled' : 'disabled'}.`);
      } catch (error) {
        console.error(error);
        input.checked = !nextEnabled;
        input.disabled = false;
        els.pageError.textContent = error.message || 'Permission could not be changed.';
      }
    }

    els.refreshBtn.addEventListener('click', loadPermissions);
    els.staffList.addEventListener('change', event => {
      if (event.target.matches('[data-stocktake-toggle]')) changePermission(event.target);
    });

    window.Techm8StaffAuth.init({
      rootSelector: '[data-auth-protected]',
      title: 'Stocktake Access Login',
      subtitle: 'Sign in with the admin account to control staff stocktake access.',
      requireLoginEmail: true,
      loginInputType: 'text',
      loginPlaceholder: 'Admin account',
      sessionKey: 'techm8_admin_session_token',
      createRpc: 'create_admin_session',
      verifyRpc: 'verify_admin_session',
      revokeRpc: 'revoke_admin_session'
    }).then(loadPermissions);
  </script>
</body>
</html>
