<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TECHM8 North Lakes Sales Report</title>
  <script src="./supabase-config.js"></script>
  <script src="./staff-auth.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
  <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
  <script src="https://unpkg.com/element-ui/lib/index.js"></script>
  <style>
    :root { --dark:#163129; --dark2:#24463b; --green:#25a244; --bg:#f3f7f8; --border:#d9e4e7; --muted:#667781; }
    * { box-sizing:border-box; }
    body { margin:0; background:linear-gradient(180deg,#edf3f5 0,#f8fafb 100%); color:#14252d; font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    [v-cloak] { display:none; }
    .shell { width:min(1480px,calc(100% - 32px)); margin:14px auto 50px; }
    .hero { padding:30px; border-radius:28px; color:#fff; background:linear-gradient(135deg,var(--dark),var(--dark2)); box-shadow:0 22px 48px rgba(15,26,34,.14); }
    .hero-row,.section-head,.actions,.summary-grid,.filter-row { display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; }
    h1 { margin:0 0 8px; font-size:clamp(30px,4vw,48px); }
    .hero p { margin:0; color:#d9e9e3; line-height:1.7; }
    .hero-meta { display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; }
    .tag { padding:9px 14px; border-radius:999px; background:rgba(255,255,255,.11); border:1px solid rgba(255,255,255,.14); font-size:12px; font-weight:800; text-transform:uppercase; }
    .panel { margin-top:18px; padding:22px; background:#fff; border:1px solid var(--border); border-radius:24px; box-shadow:0 14px 34px rgba(22,49,41,.06); }
    .tabs { margin-top:18px; display:flex; gap:10px; }
    .tab { border:1px solid var(--border); background:#fff; color:var(--dark); border-radius:999px; padding:12px 20px; font-weight:800; cursor:pointer; }
    .tab.active { background:var(--dark); color:#fff; border-color:var(--dark); }
    h2 { margin:0 0 6px; font-size:23px; }
    .sub { color:var(--muted); font-size:13px; line-height:1.6; }
    .status { display:inline-flex; align-items:center; padding:7px 11px; border-radius:999px; background:#eef3f4; color:#40535c; font-size:12px; font-weight:800; text-transform:capitalize; }
    .status.draft { background:#fff3cd; color:#7a5710; }
    .status.pricing_pending,.status.submitted { background:#ffe8d4; color:#a34b0b; }
    .status.priced { background:#dff5e5; color:#176b30; }
    .status.confirmed { background:#dcecff; color:#245b96; }
    .status.settled { background:#d8f3dc; color:#156b2b; }
    .status.paid { background:#d8f3dc; color:#156b2b; }
    .status.payment-pending { background:#fff3cd; color:#7a5710; }
    .summary-grid { align-items:stretch; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); margin-top:16px; }
    .history-summary { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .summary { padding:17px; border-radius:18px; background:#f6f9fa; border:1px solid #e3ebee; }
    .summary-label { color:var(--muted); font-size:12px; font-weight:700; }
    .summary-value { margin-top:8px; font-size:25px; font-weight:900; }
    .sale-line { padding:15px; margin-top:12px; border:1px solid var(--border); border-radius:18px; background:#fbfcfd; }
    .line-main,.line-detail { display:grid; gap:10px; align-items:end; }
    .line-main.accessory { grid-template-columns:1fr 3fr auto; }
    .line-main.repair { grid-template-columns:1fr 1.6fr 1.45fr 1.25fr 1fr; }
    .line-detail { grid-template-columns:.65fr 1.2fr 1.2fr 1.6fr auto; margin-top:11px; padding-top:11px; border-top:1px dashed #dbe5e8; }
    .stock-available { min-height:40px; display:flex; align-items:center; padding:0 13px; border:1px solid #dcdfe6; border-radius:4px; background:#f2f6f7; font-size:13px; font-weight:800; }
    .stock-available.out { color:#bd3b30; background:#fff1f0; }
    .category-badge { display:inline-flex; padding:5px 9px; margin-bottom:5px; border-radius:999px; background:#e4f4e9; color:#176b30; font-size:10px; font-weight:900; text-transform:uppercase; }
    .category-badge.repair { background:#e4efff; color:#245b96; }
    .stock-note { margin-top:7px; color:var(--muted); font-size:12px; }
    label { display:block; margin-bottom:6px; color:#42545d; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; }
    .money { font-weight:900; padding:12px 0; white-space:nowrap; }
    .empty { padding:26px; border:1px dashed #cbd9de; border-radius:18px; color:var(--muted); text-align:center; margin-top:14px; }
    .report-card { margin-top:14px; border:1px solid var(--border); border-radius:20px; overflow:hidden; }
    .report-card-head { padding:16px 18px; background:#f7fafb; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
    .report-card-body { padding:16px 18px; overflow:auto; }
    .report-card-body > table { width:100%; border-collapse:collapse; min-width:820px; }
    .report-card-body > table th,.report-card-body > table td { padding:10px; border-bottom:1px solid #e7edef; text-align:left; font-size:13px; }
    .report-card-body > table th { color:#52656e; font-size:11px; text-transform:uppercase; }
    .monthly-detail-grid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px; }
    .payment-detail-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; }
    .settlement-detail-grid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px; }
    .monthly-detail { padding:13px; border-radius:14px; background:#f7fafb; border:1px solid #e7edef; }
    .monthly-detail span { display:block; color:var(--muted); font-size:11px; font-weight:700; }
    .monthly-detail strong { display:block; margin-top:7px; font-size:17px; }
    .monthly-subhead { margin:18px 0 10px; font-size:15px; font-weight:900; }
    .monthly-detail.nl_pays_techm8 { background:#fff6e8; border-color:#f6d89e; }
    .monthly-detail.techm8_pays_nl { background:#eaf5ff; border-color:#bfddf5; }
    .monthly-detail.no_payment_due { background:#edf8f0; border-color:#c8e8d0; }
    .payment-record { margin-top:14px; padding:15px; border:1px solid #dbe5e8; border-radius:16px; background:#f7fafb; }
    .payment-record.paid { border-color:#bfe2c8; background:#eef9f1; }
    .payment-record-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap; }
    .payment-record-title { margin-bottom:5px; font-size:15px; font-weight:900; }
    .payment-proof-link { display:inline-flex; margin-top:10px; color:#245b96; font-weight:800; text-decoration:none; }
    .payment-proof-preview { display:block; width:min(320px,100%); max-height:220px; margin-top:12px; border:1px solid #d5e1e6; border-radius:14px; object-fit:contain; background:#fff; }
    .pending { color:#b65408; font-weight:800; }
    .filter-row { justify-content:flex-start; }
    @media(max-width:1100px){ .summary-grid,.monthly-detail-grid,.payment-detail-grid,.settlement-detail-grid{grid-template-columns:repeat(2,1fr)} .line-main.repair{grid-template-columns:1fr 1fr} .line-detail{grid-template-columns:1fr 1fr} }
    @media(max-width:600px){ .shell{width:min(100% - 16px,1480px)} .hero,.panel{padding:18px;border-radius:20px} .summary-grid,.monthly-detail-grid,.payment-detail-grid,.settlement-detail-grid{grid-template-columns:1fr} .line-main.accessory,.line-main.repair,.line-detail{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <div id="app" v-cloak>
    <div class="shell">
      <section class="hero">
        <div class="hero-row">
          <div>
            <h1>North Lakes Sales Report</h1>
            <p>Record accessories and repairs. Repair parts connect directly to the North Lakes LCD Tracker.</p>
            <div class="hero-meta"><span class="tag">Westfield North Lakes</span><span class="tag">{{ staffName || 'NL Staff' }}</span><span class="tag">Sales inc GST</span><span class="tag">Live LCD stock</span></div>
          </div>
          <div class="actions">
            <el-button plain @click="goBack">Back</el-button>
            <el-button type="danger" plain @click="logout">Lock NL Report</el-button>
          </div>
        </div>
      </section>

      <div class="tabs">
        <button class="tab" :class="{active:activeTab==='today'}" @click="activeTab='today'">Report Entry</button>
        <button class="tab" :class="{active:activeTab==='history'}" @click="openHistory">Report History</button>
      </div>

      <template v-if="activeTab==='today'">
        <section class="panel">
          <div class="section-head">
            <div><h2>{{ formatDate(selectedReportDate) }}</h2><div class="sub">Choose an open date, save as often as needed, then submit that date when finished.</div></div>
            <div class="actions">
              <div style="min-width:240px">
                <label>Entry Date</label>
                <el-select v-model="selectedReportDate" @change="loadReport" style="width:100%">
                  <el-option v-for="date in entryDateOptions" :key="date" :label="formatDate(date)" :value="date"></el-option>
                </el-select>
              </div>
              <span class="status" :class="report.status" v-if="report.id">{{ statusLabel(report.status) }}</span>
            </div>
          </div>
          <div class="summary-grid">
            <div class="summary"><div class="summary-label">Entries / Qty</div><div class="summary-value">{{ items.length }} / {{ unitCount }}</div></div>
            <div class="summary"><div class="summary-label">Sales Total Inc GST</div><div class="summary-value">{{ money(salesTotal) }}</div></div>
            <div class="summary"><div class="summary-label">Payable To TECHM8 Inc GST</div><div class="summary-value">{{ money(report.payable_total_inc_gst) }}</div></div>
            <div class="summary"><div class="summary-label">Pending Cost Prices</div><div class="summary-value">{{ report.pending_cost_count || 0 }}</div></div>
          </div>
        </section>

        <section class="panel">
          <div class="section-head">
            <div><h2>Products & Repairs</h2><div class="sub">Accessories allow free-text names. Repair parts are selected from the live NL LCD Tracker.</div></div>
            <el-button type="success" icon="el-icon-plus" @click="addItem" :disabled="readOnly">Add Product</el-button>
          </div>
          <div class="sale-line" v-for="(item,index) in items" :key="'line-'+index">
            <div class="line-main accessory" v-if="item.category==='accessory'">
              <div>
                <label>Category</label>
                <el-select v-model="item.category" @change="onCategoryChange(item)" style="width:100%" :disabled="readOnly">
                  <el-option label="Accessories" value="accessory"></el-option>
                  <el-option label="Repair" value="repair"></el-option>
                </el-select>
              </div>
              <div>
                <label>Product Name</label>
                <el-autocomplete v-model="item.product_name" :fetch-suggestions="queryAccessoryNames" placeholder="Type or choose a saved accessory name" style="width:100%" :disabled="readOnly"></el-autocomplete>
              </div>
              <el-button plain icon="el-icon-star-off" @click="saveAccessoryName(item)" :loading="savingAccessoryName===item.product_name" :disabled="readOnly||!String(item.product_name||'').trim()">Save Name</el-button>
            </div>

            <div class="line-main repair" v-else>
              <div>
                <label>Category</label>
                <el-select v-model="item.category" @change="onCategoryChange(item)" style="width:100%" :disabled="readOnly">
                  <el-option label="Accessories" value="accessory"></el-option>
                  <el-option label="Repair" value="repair"></el-option>
                </el-select>
              </div>
              <div>
                <label>Model</label>
                <el-select v-model="item.lcd_model_name" filterable placeholder="Choose model" style="width:100%" @change="onRepairModelChange(item)" :disabled="readOnly">
                  <el-option v-for="model in lcdModelOptions" :key="model" :label="model" :value="model"></el-option>
                </el-select>
              </div>
              <div>
                <label>Part / Type</label>
                <el-select v-model="item.lcd_inventory_item_id" filterable placeholder="Choose part / type" style="width:100%" @change="onRepairPartChange(item)" :disabled="readOnly||!item.lcd_model_name">
                  <el-option v-for="option in lcdVariantOptions(item.lcd_model_name)" :key="option.id" :label="option.variant_name" :value="option.id"></el-option>
                </el-select>
              </div>
              <div>
                <label>Action</label>
                <el-select v-model="item.stock_action" @change="onRepairActionChange(item)" style="width:100%" :disabled="readOnly">
                  <el-option label="Sold / Used In Repair" value="sold"></el-option>
                  <el-option label="Send To Other" value="send_to_other"></el-option>
                  <el-option label="Faulty" value="faulty"></el-option>
                  <el-option label="Broken" value="broken"></el-option>
                </el-select>
              </div>
              <div>
                <label>Available</label>
                <div class="stock-available" :class="{out:selectedLcdQty(item)<Number(item.quantity||0)}">{{ lcdAvailableLabel(item) }}</div>
              </div>
            </div>

            <div class="stock-note" v-if="item.category==='repair'">{{ repairProductName(item) }}<span v-if="item.stock_action!=='sold'"> · Stock only — not included in sales or payable totals.</span></div>
            <div class="line-detail">
              <div><label>Qty</label><el-input-number v-model="item.quantity" :min="1" :max="999" controls-position="right" style="width:100%" :disabled="readOnly"></el-input-number></div>
              <div><label>Unit Sale Inc GST</label><el-input v-model="item.sale_unit_price_inc_gst" placeholder="29.95" :disabled="readOnly||!isBillable(item)"><template slot="prepend">$</template></el-input></div>
              <div><label>Invoice / Receipt</label><el-input v-model="item.invoice_number" placeholder="Optional" :disabled="readOnly"></el-input></div>
              <div><label>Notes</label><el-input v-model="item.sale_notes" placeholder="Optional" :disabled="readOnly"></el-input></div>
              <div class="actions"><div class="money">{{ money(lineTotal(item)) }}</div><el-button type="danger" plain icon="el-icon-delete" @click="removeItem(index)" :disabled="readOnly"></el-button></div>
            </div>
          </div>
          <div class="empty" v-if="!items.length">No products added. You can also save and submit an empty report when there were no product sales.</div>
          <div class="section-head" style="margin-top:18px">
            <div class="sub" v-if="readOnly">This report has been submitted. The uploaded payable amount will appear in Report History.</div>
            <div class="sub" v-else>Saving keeps the report editable. Submit only after the day's entries are complete.</div>
            <div class="actions"><el-button @click="loadReport" :loading="loading">Refresh</el-button><el-button type="warning" @click="saveReport" :loading="saving" :disabled="readOnly">Save Draft</el-button><el-button type="primary" @click="submitReport" :loading="submitting" :disabled="readOnly">Submit Report</el-button></div>
          </div>
        </section>
      </template>

      <template v-else>
        <section class="panel">
          <div class="section-head"><div><h2>Report History</h2><div class="sub">Review completed reports, uploaded product costs and uploaded monthly charges.</div></div></div>
          <div class="filter-row" style="margin-top:15px">
            <el-date-picker v-model="historyRange" type="daterange" value-format="yyyy-MM-dd" range-separator="to" start-placeholder="From date" end-placeholder="To date"></el-date-picker>
            <el-button type="primary" @click="loadHistory" :loading="historyLoading">Load Reports</el-button>
            <el-button plain @click="setThisMonth">This Month</el-button>
          </div>
          <div class="summary-grid history-summary">
            <div class="summary"><div class="summary-label">Completed Reports</div><div class="summary-value">{{ historyCompletedCount }}</div></div>
            <div class="summary"><div class="summary-label">Uploaded Total Cost Inc GST</div><div class="summary-value">{{ money(historyUploadedCostTotal) }}</div></div>
          </div>
          <div class="section-head" style="margin-top:22px" v-if="monthlyCharges.length"><div><h2>Uploaded Monthly Settlements</h2><div class="sub">Monthly charges, customer payments and final settlement amounts below include GST.</div></div></div>
          <div class="report-card" v-for="charge in monthlyCharges" :key="'monthly-'+charge.id">
            <div class="report-card-head">
              <div><strong>{{ formatMonth(charge.charge_month) }} Monthly Settlement</strong><div class="sub">Cash is received directly by NL and is included in the month-end deductions.</div></div>
              <div class="actions"><span class="status confirmed">Uploaded</span><strong>{{ settlementDirectionLabel(charge) }} {{ money(settlementAmount(charge)) }}</strong></div>
            </div>
            <div class="report-card-body">
              <div class="monthly-subhead">Monthly Charges</div>
              <div class="monthly-detail-grid">
                <div class="monthly-detail"><span>Rent Inc GST (Water/Electricity, Outgoings & Promotion)</span><strong>{{ money(charge.rent_inc_gst) }}</strong></div>
                <div class="monthly-detail"><span>Internet Inc GST</span><strong>{{ money(charge.internet_inc_gst) }}</strong></div>
                <div class="monthly-detail"><span>Mobile Phone Inc GST</span><strong>{{ money(charge.mobile_inc_gst) }}</strong></div>
                <div class="monthly-detail"><span>POS Fee Inc GST</span><strong>{{ money(charge.pos_inc_gst) }}</strong></div>
                <div class="monthly-detail"><span>Franchise Fee Inc GST</span><strong>{{ money(charge.franchise_fee_inc_gst) }}</strong></div>
              </div>
              <div class="monthly-subhead">Customer Payments</div>
              <div class="payment-detail-grid">
                <div class="monthly-detail"><span>Tyro Received By TECHM8 Inc GST</span><strong>{{ money(charge.tyro_received_inc_gst) }}</strong></div>
                <div class="monthly-detail"><span>Bank Transfer Received By TECHM8 Inc GST</span><strong>{{ money(charge.bank_transfer_received_inc_gst) }}</strong></div>
                <div class="monthly-detail"><span>Afterpay / Zip Received By TECHM8 Inc GST</span><strong>{{ money(charge.after_zip_received_inc_gst) }}</strong></div>
                <div class="monthly-detail"><span>Cash Received Directly By NL Inc GST</span><strong>{{ money(charge.cash_retained_inc_gst) }}</strong></div>
              </div>
              <div class="monthly-subhead">Final Settlement</div>
              <div class="settlement-detail-grid">
                <div class="monthly-detail"><span>Product Payable Inc GST</span><strong>{{ money(charge.product_payable_total_inc_gst) }}</strong></div>
                <div class="monthly-detail"><span>Monthly Charges Inc GST</span><strong>{{ money(charge.monthly_charge_total_inc_gst) }}</strong></div>
                <div class="monthly-detail"><span>Total Deductions (Product + Charges + Cash) Inc GST</span><strong>{{ money(charge.settlement_deductions_total_inc_gst) }}</strong></div>
                <div class="monthly-detail"><span>Received By TECHM8 For NL Inc GST</span><strong>{{ money(charge.techm8_received_total_inc_gst) }}</strong></div>
                <div class="monthly-detail" :class="charge.settlement_direction"><span>Month-End Settlement Inc GST</span><strong>{{ settlementDirectionLabel(charge) }} {{ money(settlementAmount(charge)) }}</strong></div>
              </div>
              <div class="payment-record paid" v-if="charge.payment_status==='paid'">
                <div class="payment-record-head">
                  <div><div class="payment-record-title">Payment Completed</div><div class="sub">TECHM8 paid NL {{ money(charge.payment_amount_inc_gst) }} on {{ formatTimestamp(charge.paid_at) }}.</div></div>
                  <span class="status paid">Paid</span>
                </div>
                <a class="payment-proof-link" :href="paymentProofUrl(charge.payment_proof_path)" target="_blank" rel="noopener">View Payment Screenshot</a>
                <a :href="paymentProofUrl(charge.payment_proof_path)" target="_blank" rel="noopener"><img class="payment-proof-preview" :src="paymentProofUrl(charge.payment_proof_path)" alt="Payment screenshot"></a>
              </div>
              <div class="payment-record" v-else-if="charge.settlement_direction==='techm8_pays_nl'">
                <div class="payment-record-head"><div><div class="payment-record-title">Payment Pending</div><div class="sub">TECHM8 has not yet marked this settlement as paid.</div></div><span class="status payment-pending">Pending</span></div>
              </div>
              <div class="sub" style="margin-top:12px" v-if="charge.notes">{{ charge.notes }}</div>
            </div>
          </div>
          <div class="empty" v-if="historyReports.length && !monthlyCharges.length && !historyLoading">No monthly charges have been uploaded for this date range.</div>
          <div class="report-card" v-for="row in historyReports" :key="row.id">
            <div class="report-card-head"><div><strong>{{ formatDate(row.report_date) }}</strong><div class="sub">Entered by {{ row.started_by_staff_name }}</div></div><div class="actions"><span class="status" :class="row.status">{{ statusLabel(row.status) }}</span><strong v-if="isUploadedReport(row)">{{ money(row.payable_total_inc_gst) }} cost inc GST</strong><strong v-else>Cost pending admin upload</strong></div></div>
            <div class="report-card-body"><table><thead><tr><th>Product</th><th>Qty</th><th>Sale Unit Inc GST</th><th>Sale Total</th><th>Cost Unit Ex GST</th><th>Cost Unit Inc GST</th><th>Payable Inc GST</th></tr></thead><tbody><tr v-for="item in row.items" :key="item.id"><td><span class="category-badge" :class="{repair:item.category==='repair'}">{{ item.category==='repair' ? 'Repair' : 'Accessories' }}</span><div>{{ item.product_name }}</div><div class="sub" v-if="item.category==='repair'">{{ stockActionLabel(item.stock_action) }}<span v-if="item.stock_before!==null&&item.stock_before!==undefined"> · Stock {{ item.stock_before }} → {{ item.stock_after }}</span></div></td><td>{{ item.quantity }}</td><td>{{ item.is_billable===false ? '—' : money(item.sale_unit_price_inc_gst) }}</td><td>{{ item.is_billable===false ? 'Stock only' : money(item.sale_total_inc_gst) }}</td><td :class="{pending:item.is_billable!==false&&item.cost_unit_price_ex_gst===null}">{{ item.is_billable===false ? '—' : (item.cost_unit_price_ex_gst===null ? 'Pending' : money(item.cost_unit_price_ex_gst)) }}</td><td>{{ item.cost_unit_price_inc_gst===null ? '—' : money(item.cost_unit_price_inc_gst) }}</td><td>{{ item.cost_total_inc_gst===null ? '—' : money(item.cost_total_inc_gst) }}</td></tr><tr v-if="!row.items.length"><td colspan="7">No product sales.</td></tr></tbody></table></div>
          </div>
          <div class="empty" v-if="!historyReports.length && !monthlyCharges.length && !historyLoading">No reports or uploaded monthly charges found for this date range.</div>
        </section>
      </template>
    </div>
  </div>
  <script>
    const NL_SESSION_KEY = 'techm8_nl_report_session_token';
    new Vue({
      el:'#app',
      data(){ const today=new Date().toLocaleDateString('en-CA',{timeZone:'Australia/Brisbane'}); return { activeTab:'today', staffName:'', todayIso:today, selectedReportDate:today, backfillDateFrom:'', backfillDateTo:'', draftReportDates:[], accessoryNames:[], lcdItems:[], savingAccessoryName:'', report:{status:'draft',items:[]}, items:[], loading:false, saving:false, submitting:false, historyLoading:false, historyRange:[], historyReports:[], monthlyCharges:[] }; },
      computed:{
        readOnly(){ return Boolean(this.report.id && this.report.status !== 'draft'); },
        entryDateOptions(){
          const dates=new Set([this.todayIso,this.selectedReportDate]);
          for(const date of this.draftReportDates){ if(date)dates.add(date); }
          if(this.backfillDateFrom&&this.backfillDateTo){
            const cursor=new Date(this.backfillDateFrom+'T00:00:00');
            const end=new Date(this.backfillDateTo+'T00:00:00');
            while(cursor<=end){ dates.add(cursor.toLocaleDateString('en-CA',{timeZone:'Australia/Brisbane'})); cursor.setDate(cursor.getDate()+1); }
          }
          return Array.from(dates).sort((a,b)=>b.localeCompare(a));
        },
        lcdModelOptions(){ return Array.from(new Set(this.lcdItems.map(item=>item.model_name).filter(Boolean))).sort((a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true,sensitivity:'base'})); },
        unitCount(){ return this.items.reduce((sum,item)=>sum+Number(item.quantity||0),0); },
        salesTotal(){ return this.items.reduce((sum,item)=>sum+this.lineTotal(item),0); },
        historyCompletedCount(){ return this.historyReports.filter(row=>row.status!=='draft').length; },
        historyUploadedCostTotal(){ return this.historyReports.filter(row=>this.isUploadedReport(row)).reduce((sum,row)=>sum+Number(row.payable_total_inc_gst||0),0); }
      },
      async mounted(){
        const token=sessionStorage.getItem(NL_SESSION_KEY)||'';
        if(!token){ return this.goBack(); }
        try{ const result=await window.Techm8StaffAuth.callRpc('verify_nl_report_session',{session_token:token}); if(!result||!result.ok) return this.goBack(); await this.loadEntryConfig(); await this.loadReport(); }
        catch(error){ this.$message.error(error.message||'NL session expired.'); this.goBack(); }
      },
      methods:{
        token(){ return sessionStorage.getItem(NL_SESSION_KEY)||''; },
        makeItem(){ return {category:'accessory',product_name:'',lcd_inventory_item_id:null,lcd_model_name:'',lcd_variant_name:'',stock_action:'',quantity:1,sale_unit_price_inc_gst:'',invoice_number:'',sale_notes:''}; },
        normalizeItem(item){ return Object.assign(this.makeItem(),item||{},{category:(item&&item.category)||'accessory',lcd_inventory_item_id:item&&item.lcd_inventory_item_id!==undefined?item.lcd_inventory_item_id:null,stock_action:(item&&item.stock_action)||''}); },
        addItem(){ this.items.push(this.makeItem()); },
        removeItem(index){ this.items.splice(index,1); },
        isBillable(item){ return item.category!=='repair'||item.stock_action==='sold'; },
        lineTotal(item){ if(!this.isBillable(item))return 0; return Math.round((Number(item.sale_unit_price_inc_gst||0)*Number(item.quantity||0)+Number.EPSILON)*100)/100; },
        money(value){ return '$'+Number(value||0).toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2}); },
        formatDate(value){ if(!value)return ''; return new Date(value+'T00:00:00').toLocaleDateString('en-AU',{weekday:'short',day:'2-digit',month:'short',year:'numeric'}); },
        formatMonth(value){ if(!value)return ''; return new Date(value+'T00:00:00').toLocaleDateString('en-AU',{month:'long',year:'numeric'}); },
        formatTimestamp(value){ if(!value)return ''; return new Date(value).toLocaleString('en-AU',{timeZone:'Australia/Brisbane',day:'2-digit',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'}); },
        paymentProofUrl(path){ if(!path||!window.TECHM8_SUPABASE)return ''; return window.TECHM8_SUPABASE.url+'/storage/v1/object/public/nl-settlement-payment-proofs/'+path; },
        settlementAmount(charge){ return Math.abs(Number(charge&&charge.net_settlement_inc_gst||0)); },
        settlementDirectionLabel(charge){ const direction=charge&&charge.settlement_direction; if(direction==='nl_pays_techm8')return 'NL Pays TECHM8'; if(direction==='techm8_pays_nl')return 'TECHM8 Pays NL'; return 'Nothing To Pay'; },
        statusLabel(value){ const labels={draft:'draft',submitted:'awaiting cost upload',pricing_pending:'awaiting cost upload',priced:'awaiting cost upload',confirmed:'uploaded',settled:'uploaded'}; return labels[value]||String(value||'draft').replace(/_/g,' '); },
        isUploadedReport(report){ return ['confirmed','settled'].includes(report&&report.status); },
        stockActionLabel(value){ const labels={sold:'Sold / Used In Repair',send_to_other:'Send To Other',faulty:'Faulty',broken:'Broken'}; return labels[value]||'Choose action'; },
        queryAccessoryNames(query,done){ const needle=String(query||'').trim().toLowerCase(); done(this.accessoryNames.filter(name=>!needle||name.toLowerCase().includes(needle)).slice(0,30).map(name=>({value:name}))); },
        async saveAccessoryName(item){ const name=String(item.product_name||'').trim(); if(!name)return; this.savingAccessoryName=item.product_name; try{ const result=await window.Techm8StaffAuth.callRpc('save_nl_accessory_name',{session_token:this.token(),accessory_name:name}); const saved=result&&result.accessory&&result.accessory.name?result.accessory.name:name; if(!this.accessoryNames.some(entry=>entry.toLowerCase()===saved.toLowerCase()))this.accessoryNames.push(saved); this.accessoryNames.sort((a,b)=>a.localeCompare(b,undefined,{numeric:true,sensitivity:'base'})); item.product_name=saved; this.$message.success('Accessory name saved.'); }catch(error){this.$message.error(error.message||'Could not save accessory name.');}finally{this.savingAccessoryName='';} },
        lcdVariantOptions(modelName){ return this.lcdItems.filter(item=>item.model_name===modelName).slice().sort((a,b)=>String(a.variant_name).localeCompare(String(b.variant_name),undefined,{numeric:true,sensitivity:'base'})); },
        selectedLcdItem(item){ return this.lcdItems.find(entry=>Number(entry.id)===Number(item.lcd_inventory_item_id))||null; },
        selectedLcdQty(item){ const selected=this.selectedLcdItem(item); return selected?Number(selected.current_qty||0):0; },
        lcdAvailableLabel(item){ const selected=this.selectedLcdItem(item); if(!selected)return item.lcd_model_name?'Choose part / type':'Choose model and part'; return String(selected.current_qty)+' in stock'; },
        repairProductName(item){ if(item.category!=='repair')return ''; const selected=this.selectedLcdItem(item); const model=selected?selected.model_name:item.lcd_model_name; const variant=selected?selected.variant_name:item.lcd_variant_name; if(!model||!variant)return 'Choose a model and part from the NL LCD Tracker'; return model+' - '+variant+(item.stock_action==='sold'?' Repair':' - '+this.stockActionLabel(item.stock_action)); },
        onCategoryChange(item){ item.product_name=''; item.lcd_inventory_item_id=null; item.lcd_model_name=''; item.lcd_variant_name=''; item.stock_action=item.category==='repair'?'sold':''; item.sale_unit_price_inc_gst=''; },
        onRepairModelChange(item){ item.lcd_inventory_item_id=null; item.lcd_variant_name=''; item.product_name=''; },
        onRepairPartChange(item){ const selected=this.selectedLcdItem(item); item.lcd_model_name=selected?selected.model_name:item.lcd_model_name; item.lcd_variant_name=selected?selected.variant_name:''; item.product_name=this.repairProductName(item); },
        onRepairActionChange(item){ if(item.stock_action!=='sold')item.sale_unit_price_inc_gst=0; else if(Number(item.sale_unit_price_inc_gst||0)===0)item.sale_unit_price_inc_gst=''; item.product_name=this.repairProductName(item); },
        validate(){ for(let i=0;i<this.items.length;i++){ const item=this.items[i]; if(!['accessory','repair'].includes(item.category))throw new Error('Choose Accessories or Repair on line '+(i+1)+'.'); if(item.category==='accessory'&&!String(item.product_name||'').trim())throw new Error('Product name is required on line '+(i+1)+'.'); if(item.category==='repair'&&(!item.lcd_inventory_item_id||!item.lcd_model_name||!item.lcd_variant_name||!item.stock_action))throw new Error('Choose the model, part and action on repair line '+(i+1)+'.'); if(Number(item.quantity||0)<=0)throw new Error('Quantity must be greater than zero on line '+(i+1)+'.'); if(this.isBillable(item)&&(item.sale_unit_price_inc_gst===''||Number(item.sale_unit_price_inc_gst)<0))throw new Error('Sale price is required on line '+(i+1)+'.'); } },
        async loadEntryConfig(){ const result=await window.Techm8StaffAuth.callRpc('get_nl_report_entry_config',{session_token:this.token()}); this.todayIso=result.today||this.todayIso; this.selectedReportDate=this.todayIso; this.backfillDateFrom=result.backfill_date_from||''; this.backfillDateTo=result.backfill_date_to||''; this.draftReportDates=Array.isArray(result.draft_dates)?result.draft_dates:[]; this.accessoryNames=(Array.isArray(result.accessory_names)?result.accessory_names:[]).map(item=>item.name).filter(Boolean); this.lcdItems=Array.isArray(result.lcd_items)?result.lcd_items:[]; },
        async loadReport(){ this.loading=true; try{ const result=await window.Techm8StaffAuth.callRpc('get_nl_sales_report',{session_token:this.token(),target_date:this.selectedReportDate}); this.staffName=result.staff_name||''; this.report=result.report||{status:'draft',items:[]}; this.items=(this.report.items||[]).map(item=>this.normalizeItem(item)); } catch(error){ this.$message.error(error.message||'Could not load the selected report.'); } finally{ this.loading=false; } },
        async saveReport(showMessage=true){ try{this.validate();}catch(error){this.$message.error(error.message);return false;} this.saving=true; try{ const result=await window.Techm8StaffAuth.callRpc('save_nl_sales_report_entry',{session_token:this.token(),payload:{report_date:this.selectedReportDate,items:this.items}}); this.report=result.report; this.items=(result.report.items||[]).map(item=>this.normalizeItem(item)); if(showMessage)this.$message.success('NL report draft saved for '+this.formatDate(this.selectedReportDate)+'.'); return true; } catch(error){ this.$message.error(error.message||'Could not save NL report.'); return false; } finally{ this.saving=false; } },
        async submitReport(){ try{ await this.$confirm('Submit the NL report for '+this.formatDate(this.selectedReportDate)+'? Repair quantities will be deducted from the live NL LCD Tracker and all entries will become read-only.','Submit NL Report',{confirmButtonText:'Submit',cancelButtonText:'Cancel',type:'warning'}); }catch(_){return;} if(!await this.saveReport(false))return; this.submitting=true; try{ const result=await window.Techm8StaffAuth.callRpc('submit_nl_sales_report_entry',{session_token:this.token(),target_date:this.selectedReportDate}); this.report=result.report; this.items=(result.report.items||[]).map(item=>this.normalizeItem(item)); await this.loadEntryConfigPreserveDate(); this.$message.success('NL report submitted and repair stock updated for '+this.formatDate(this.selectedReportDate)+'.'); }catch(error){this.$message.error(error.message||'Could not submit NL report.');}finally{this.submitting=false;} },
        async loadEntryConfigPreserveDate(){ const selected=this.selectedReportDate; const result=await window.Techm8StaffAuth.callRpc('get_nl_report_entry_config',{session_token:this.token()}); this.draftReportDates=Array.isArray(result.draft_dates)?result.draft_dates:[]; this.accessoryNames=(Array.isArray(result.accessory_names)?result.accessory_names:[]).map(item=>item.name).filter(Boolean); this.lcdItems=Array.isArray(result.lcd_items)?result.lcd_items:[]; this.selectedReportDate=selected; },
        setThisMonth(){ const today=this.todayIso; this.historyRange=[today.slice(0,8)+'01',today]; this.loadHistory(); },
        openHistory(){ this.activeTab='history'; if(!this.historyRange.length)this.setThisMonth(); else this.loadHistory(); },
        async loadHistory(){ if(!this.historyRange||this.historyRange.length!==2)return this.$message.error('Choose a date range.'); this.historyLoading=true; try{ const [reportResult,chargeResult]=await Promise.all([window.Techm8StaffAuth.callRpc('list_nl_sales_reports',{session_token:this.token(),date_from:this.historyRange[0],date_to:this.historyRange[1]}),window.Techm8StaffAuth.callRpc('list_nl_monthly_charges',{session_token:this.token(),date_from:this.historyRange[0],date_to:this.historyRange[1]})]); this.historyReports=Array.isArray(reportResult.reports)?reportResult.reports:[]; this.monthlyCharges=Array.isArray(chargeResult.charges)?chargeResult.charges:[]; }catch(error){this.$message.error(error.message||'Could not load report history.');}finally{this.historyLoading=false;} },
        goBack(){ window.location.href='./daily-report.html'; },
        async logout(){ const token=this.token(); try{ if(token)await window.Techm8StaffAuth.callRpc('revoke_nl_report_session',{session_token:token}); }catch(_){} sessionStorage.removeItem(NL_SESSION_KEY); this.goBack(); }
      }
    });
  </script>
